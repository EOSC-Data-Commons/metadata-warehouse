name: Python package

on: [ push ]

jobs:
    test-src:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                python-version: [ "3.12", "3.13" ]
        env:
            UV_PYTHON: ${{ matrix.python-version }}
        steps:
            -   uses: actions/checkout@v6
            -   name: Install uv
                uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
            -   name: Install the project
                run: uv sync --all-extras --group dev # https://docs.astral.sh/uv/guides/integration/github/#syncing-and-running
            -   name: Test with pytest
                run: uv run pytest tests
            -   name: Check root mypy
                run: uv run mypy --strict
            -   name: Check scripts mypy
                run: uv run mypy --config-file scripts/pyproject.toml
            -   name: Check format
                run: uv run ruff format --check
            -   name: Check linting
                run: uv run ruff check --select I .
    test-e2e:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                python-version: [ "3.12", "3.13" ]
        env:
            UV_PYTHON: ${{ matrix.python-version }}
        steps:
            -   uses: actions/checkout@v6

            -   name: Cache FastEmbed models
                uses: actions/cache@v5
                with:
                    path: ./cache/fastembed
                    key: fastembed-${{ hashFiles('uv.lock') }}
                    restore-keys: |
                        fastembed-

            -   name: Docker Build
                run: docker compose build

            -   name: Config
                run: |
                    cp docker-compose.override.yml.template docker-compose.override.yml
                    cp env.template_e2e .env
                    cp keys.env.template keys.env 

            -   name: Start services
                run: docker compose up -d

            -   name: Wait for services to be ready
                run: |
                    echo "Waiting for API to be ready..."
                    timeout 60 bash -c 'until curl -f http://localhost:8080/health; do sleep 2; done'
                    echo "Waiting for database to be ready..."
                    timeout 60 bash -c 'until docker compose exec -T postgres pg_isready -U admin; do sleep 2; done'

            -   name: Install uv
                uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

            -   name: Install the project
                run: uv sync --all-extras --dev

            -   name: Test with pytest
                run: uv run pytest -s e2e


