[project]
name = "metadata-warehouse-scripts"
version = "0.0.1"
description = "Prepare and import DataCite OAI-PMH XML metadata into PostgreSQL"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.2.2",
    "xmltodict>=1.0.4",
    "jsonschema>=4.26.0",
    "fastembed>=0.7.4",
    "lxml>=6.0.2",
    "psycopg[binary]>=3.3.3"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.mypy]
python_version = "3.12"
strict = true

files = ["."]
explicit_package_bases = true

# prevent mypy from walking outside scripts project
exclude = [
    "(?x)^(?!scripts/).*$",  # only allow files under scripts/
    "postgres_data/dataverse.py",
    "postgres_data/get_meta.py",
]
