# Shared by every airflow service: same image, same environment, same mounts.
# Adapted from https://airflow.apache.org/docs/apache-airflow/stable/howto/docker-compose/index.html
# with the metadata DB moved into the warehouse postgres. CeleryExecutor: the scheduler hands tasks
# to airflow-worker over rabbitmq, so workers scale with `--scale airflow-worker=N` and can later
# move to their own machines.
x-airflow-common: &airflow-common
    build:
        dockerfile: ./docker/airflow/Dockerfile
        context: .
    environment: &airflow-common-env
        AIRFLOW__CORE__EXECUTOR: CeleryExecutor
        AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
        # Its own database in the warehouse postgres. A password with URL reserved characters
        # (@ : / ?) has to be percent encoded here.
        AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
            postgresql+psycopg2://${POSTGRES_ADMIN}:${POSTGRES_PASSWORD}@${POSTGRES_ADDRESS:-postgres}:${POSTGRES_PORT:-5432}/airflowdb
        AIRFLOW__CORE__FERNET_KEY: "${AIRFLOW_FERNET_KEY}"
        AIRFLOW__API_AUTH__JWT_SECRET: "${AIRFLOW_JWT_SECRET}"
        AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
        AIRFLOW__CORE__LOAD_EXAMPLES: "false"
        AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
        # The queue the scheduler publishes to, and where task results are read back from. The
        # result backend is postgres, not the broker: celery's amqp backend is deprecated.
        AIRFLOW__CELERY__BROKER_URL: amqp://${RABBITMQ_ADMIN}:${RABBITMQ_PW}@broker:5672//
        AIRFLOW__CELERY__RESULT_BACKEND: >-
            db+postgresql://${POSTGRES_ADMIN}:${POSTGRES_PASSWORD}@${POSTGRES_ADDRESS:-postgres}:${POSTGRES_PORT:-5432}/airflowdb
        # Each transform task loads its own fastembed model, so parallelism is bounded by RAM, not
        # by CPU. Worker concurrency is the per-container slot count, parallelism the cluster wide
        # ceiling, so raise both (or add workers) to run more batches at once.
        AIRFLOW__CELERY__WORKER_CONCURRENCY: "${AIRFLOW_WORKER_CONCURRENCY:-2}"
        AIRFLOW__CORE__PARALLELISM: "${AIRFLOW_PARALLELISM:-2}"
        AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "${AIRFLOW_PARALLELISM:-2}"
        AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
        # The warehouse jobs the DAGs call, same variables the transform service gets
        PYTHONPATH: /opt/airflow/warehouse/src:/opt/airflow/warehouse
        WAREHOUSE_API_URL: "${WAREHOUSE_API_URL}"
        INDEX_NAME: "${INDEX_NAME}"
        TRANSFORM_BATCH_SIZE: "${TRANSFORM_BATCH_SIZE}"
        EMBEDDING_MODEL: "${EMBEDDING_MODEL}"
        POSTGRES_USER: "${POSTGRES_ADMIN}"
        POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
        POSTGRES_DB: "${POSTGRES_DB}"
        FILE_DB: "${FILE_DB}"
        POSTGRES_ADDRESS: "${POSTGRES_ADDRESS}"
        POSTGRES_PORT: "${POSTGRES_PORT}"
        OPENSEARCH_ADDRESS: "${OPENSEARCH_ADDRESS}"
        OPENSEARCH_PORT: "${OPENSEARCH_PORT}"
    volumes:
        # Mounted as well as baked into the image, so editing a DAG or a job needs no rebuild
        - ./dags:/opt/airflow/dags
        - ./src:/opt/airflow/warehouse/src
        - ./config:/opt/airflow/warehouse/config
        - ./.cache/fastembed:/opt/airflow/cache/fastembed
        - airflow-logs:/opt/airflow/logs
    user: "${AIRFLOW_UID:-50000}:0"
    networks:
        - warehouse-backend
    depends_on: &airflow-common-depends-on
        postgres:
            condition: service_healthy
        broker:
            condition: service_healthy
        airflow-apiserver:
            condition: service_healthy

services:
    # The UI and the REST API, and the execution API the workers report task state back to
    airflow-apiserver:
        <<: *airflow-common
        command: api-server
        restart: unless-stopped
        depends_on:
            postgres:
                condition: service_healthy
        environment:
            <<: *airflow-common-env
            # /entrypoint migrates the schema and creates the admin user before starting any
            # component, so this needs no init container. The database itself is created by
            # scripts/postgres_data/init_dbs.sh, with every other warehouse database.
            _AIRFLOW_DB_MIGRATE: "true"
            _AIRFLOW_WWW_USER_CREATE: "true"
            _AIRFLOW_WWW_USER_USERNAME: "${AIRFLOW_ADMIN:-airflow}"
            _AIRFLOW_WWW_USER_PASSWORD: "${AIRFLOW_ADMIN_PASSWORD}"
        healthcheck:
            test: [ "CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health" ]
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 30s

    # Schedules the DAGs and queues their tasks, the workers below run them
    airflow-scheduler:
        <<: *airflow-common
        command: scheduler
        restart: unless-stopped
        healthcheck:
            test: [ "CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"' ]
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 30s
        depends_on:
            <<: *airflow-common-depends-on
            opensearch:
                condition: service_healthy

    # Runs the queued tasks. `docker compose up -d --scale airflow-worker=3` for more capacity;
    # opensearch is a dependency here rather than on the scheduler because the tasks write to it.
    airflow-worker:
        <<: *airflow-common
        command: celery worker
        restart: unless-stopped
        # Give a task time to finish instead of killing it mid batch on stop or rescale
        stop_grace_period: 5m
        healthcheck:
            test: [ "CMD-SHELL", 'celery --app airflow.providers.celery.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}"' ]
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 60s
        depends_on:
            <<: *airflow-common-depends-on
            opensearch:
                condition: service_healthy

    # Celery queue monitoring, off by default: `docker compose --profile flower up -d flower`
    flower:
        <<: *airflow-common
        command: celery flower
        restart: unless-stopped
        profiles: [ flower ]
        healthcheck:
            test: [ "CMD", "curl", "--fail", "http://localhost:5555/" ]
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 30s

    # The task queue. Celery's own result backend is postgres, see AIRFLOW__CELERY__RESULT_BACKEND
    broker:
        image: rabbitmq:3-management-alpine
        restart: unless-stopped
        volumes:
            - broker-data:/var/lib/rabbitmq
        networks:
            - warehouse-backend
        environment:
            RABBITMQ_DEFAULT_USER: "${RABBITMQ_ADMIN}"
            RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PW}"
        healthcheck:
            test: [ "CMD", "rabbitmq-diagnostics", "ping" ]
            interval: 10s
            timeout: 5s
            retries: 3

    # Parses the dags folder. A separate service since airflow 3, the scheduler no longer does it.
    airflow-dag-processor:
        <<: *airflow-common
        command: dag-processor
        restart: unless-stopped
        healthcheck:
            test: [ "CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"' ]
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 30s

    transform:
        build:
            dockerfile: ./docker/transform/Dockerfile
            context: .
        volumes:
            - ./src:/code/src
            - ./config:/code/config
            - ./.cache/fastembed:/root/.cache/fastembed
        command: [ "fastapi", "run", "--host", "0.0.0.0", "app/routes.py", "--port", "80" ]
        networks:
            - warehouse-backend
        environment:
            PYTHONPATH: /code/src:/code
            POSTGRES_USER: "${POSTGRES_ADMIN}"
            POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
            POSTGRES_DB: "${POSTGRES_DB}"
            POSTGRES_ADDRESS: "${POSTGRES_ADDRESS}"
            POSTGRES_PORT: "${POSTGRES_PORT}"
            OPENSEARCH_ADDRESS: "${OPENSEARCH_ADDRESS}"
            OPENSEARCH_PORT: "${OPENSEARCH_PORT}"
            EMBEDDING_MODEL: "${EMBEDDING_MODEL}"
        depends_on:
            postgres:
                condition: service_healthy
            opensearch:
                condition: service_healthy

    postgres:
        image: postgres:17-alpine
        environment:
            POSTGRES_USER: "${POSTGRES_ADMIN}"
            POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
            POSTGRES_DB: "${POSTGRES_DB}"
        restart: unless-stopped
        volumes:
            - postgres-data:/var/lib/postgresql/data
            # airflowdb has to exist before airflow's first connection, see the script
            - ./scripts/postgres_data/create_airflowdb.sh:/docker-entrypoint-initdb.d/10-airflowdb.sh:ro
        networks:
            - warehouse-backend
        healthcheck:
            test: [ "CMD-SHELL", "pg_isready" ]
            interval: 10s
            timeout: 5s
            retries: 3


    pgadmin:
        image: dpage/pgadmin4:9.8
        container_name: pgadmin4_container
        restart: unless-stopped
        depends_on:
            postgres:
                condition: service_healthy
        environment:
            PGADMIN_DEFAULT_EMAIL: "${PGADMIN_ADMIN}"
            PGADMIN_DEFAULT_PASSWORD: "${PGADMIN_DEFAULT_PASSWORD}"
        volumes:
            - pgadmin-data:/var/lib/pgadmin
        networks:
            - warehouse-backend

    tool-registry:
        image: ghcr.io/eosc-data-commons/tool-registry:latest
        container_name: tool-registry
        restart: unless-stopped
        depends_on:
            postgres:
                condition: service_healthy
        environment:
            TOOL_REGISTRY_DATABASE__HOST: ${POSTGRES_ADDRESS}
            TOOL_REGISTRY_DATABASE__PORT: ${POSTGRES_PORT}
            TOOL_REGISTRY_DATABASE__NAME: ${TOOL_DB}
            TOOL_REGISTRY_DATABASE__USER: ${TOOL_DB_USER}
            TOOL_REGISTRY_DATABASE__PASSWORD: ${TOOL_DB_PASSWORD}
            TOOL_REGISTRY_SERVICE__EGI_ENV: ${EGI_CHECKIN_ENV}
        networks:
            - warehouse-backend

    opensearch:
        restart: unless-stopped
        image: opensearchproject/opensearch:3.2.0
        networks:
            - warehouse-backend
        environment:
            discovery.type: single-node
            bootstrap.memory_lock: "true"
            OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
            cluster.name: opensearch-cluster
            plugins.security.disabled: "true"
            OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_INITIAL_ADMIN_PASSWORD}
        ulimits:
            memlock:
                soft: -1
                hard: -1
            nofile:
                soft: 65536
                hard: 65536
        volumes:
            - opensearch-data:/usr/share/opensearch/data
        healthcheck:
            test: [ "CMD-SHELL", "curl --silent --fail http://localhost:9200/_cluster/health || exit 1" ]

    opensearch-dashboards:
        restart: unless-stopped
        image: opensearchproject/opensearch-dashboards:3.2.0
        environment:
            - OPENSEARCH_HOSTS=["http://opensearch:9200"]
            - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
        volumes:
            - opensearch-dashboards-data:/usr/share/opensearch-dashboards/data
        depends_on:
            opensearch:
                condition: service_healthy
        networks:
            - warehouse-backend

    #https://github.com/EOSC-Data-Commons/matchmaker/pkgs/container/matchmaker-frontend
    frontend:
        image: ghcr.io/eosc-data-commons/matchmaker-frontend:latest
        restart: unless-stopped
        depends_on:
            opensearch:
                condition: service_healthy
        command: npm run prod
        environment:
            - NODE_ENV=production
            - SEARCH_API_URL=http://search-api:8000
            - GRPC_TARGET=coordinator:50051
        networks:
            - warehouse-backend
            
    #https://github.com/EOSC-Data-Commons/req-packager/pkgs/container/coordinator
    coordinator:
        image: ghcr.io/eosc-data-commons/coordinator:latest
        restart: unless-stopped
        depends_on:
            postgres:
                condition: service_healthy
        command: 
            ["rp"]
        environment:
            POSTGRES_USER: "${POSTGRES_ADMIN}"
            POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
            POSTGRES_DB: "${POSTGRES_DB}"
            POSTGRES_ADDRESS: "${POSTGRES_ADDRESS}"
            POSTGRES_PORT: "${POSTGRES_PORT}"
            FILE_DB: "${FILE_DB}"
            TOOL_REGISTRY_API: "https://dev.tools-registry.eosc-data-commons.eu/api/v1"
        networks:
            - warehouse-backend
        ports:
          - "50051:50051"

    # https://github.com/EOSC-Data-Commons/data-commons-search/pkgs/container/data-commons-search
    search-api:
        restart: unless-stopped
        image: ghcr.io/eosc-data-commons/data-commons-search:latest
        depends_on:
            opensearch:
                condition: service_healthy
        volumes:
            - search-api-data:/app/data
        env_file: [ keys.env ]
        environment:
            - OPENSEARCH_URL=http://opensearch:9200
        networks:
            - warehouse-backend

    # https://github.com/EOSC-Data-Commons/metadata-crawlers/pkgs/container/metadata-crawlers
    harvester:
        image: ghcr.io/eosc-data-commons/metadata-crawlers:latest
        profiles: ["manual"]
        env_file:
            - .env
        volumes:
            - harvester-logs:/app/logs
        entrypoint: ["python", "-m", "harvester"]
        networks:
            - warehouse-backend

volumes:
    postgres-data:
    pgadmin-data:
    opensearch-data:
    opensearch-dashboards-data:
    airflow-logs:
    broker-data:
    search-api-data:
    frontend-data:
    harvester-logs:

networks:
    warehouse-backend:
