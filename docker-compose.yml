# Shared settings of all airflow-* services (YAML anchors).
x-airflow-common: &airflow-common
    build:
        dockerfile: ./docker/airflow/Dockerfile
        context: .
    image: metadata-warehouse-airflow:3.3.2
    user: "${AIRFLOW_UID:-50000}:0"
    networks:
        - warehouse-backend
    environment: &airflow-common-env
        AIRFLOW__CORE__EXECUTOR: CeleryExecutor
        AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
        AIRFLOW__CORE__FERNET_KEY: "${AIRFLOW_FERNET_KEY}"
        AIRFLOW__CORE__LOAD_EXAMPLES: "false"
        AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
        # workers run in other containers and talk to the execution API of the api-server
        AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
        # must be identical in all containers, otherwise task tokens are rejected
        AIRFLOW__API_AUTH__JWT_SECRET: "${AIRFLOW_JWT_SECRET}"
        AIRFLOW__API__SECRET_KEY: "${AIRFLOW_API_SECRET_KEY}"
        AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@airflow-postgres/airflow
        # Celery executor: RabbitMQ (existing broker, default vhost) as broker, airflow DB as result backend.
        # Airflow uses the queue "default"; the legacy celery worker only consumes the queue "celery".
        AIRFLOW__CELERY__BROKER_URL: amqp://${RABBITMQ_ADMIN}:${RABBITMQ_PW}@broker:5672//
        AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:${AIRFLOW_DB_PASSWORD}@airflow-postgres/airflow
        AIRFLOW__CELERY__WORKER_CONCURRENCY: "4"
        # a mapped task (one per transform batch) may expand to at most this many instances (Airflow default: 1024)
        AIRFLOW__CORE__MAX_MAP_LENGTH: "10000"
        # warehouse code (src/, config/) is mounted below; the planning tasks import it (src/planning, src/utils)
        PYTHONPATH: /opt/airflow/project/src:/opt/airflow/project
        # defaults of DAG params (read when the DAG file is parsed)
        INDEX_NAME: "${INDEX_NAME}"
        CELERY_BATCH_SIZE: "${CELERY_BATCH_SIZE}"
    volumes:
        - ./airflow/dags:/opt/airflow/dags
        - ./airflow/plugins:/opt/airflow/plugins
        - airflow-logs:/opt/airflow/logs
        - ./src:/opt/airflow/project/src
        - ./config:/opt/airflow/project/config
    depends_on: &airflow-common-depends-on
        broker:
            condition: service_healthy
        airflow-postgres:
            condition: service_healthy

# Credentials/addresses of PostgreSQL and OpenSearch; only needed by the worker that runs the planning tasks.
x-airflow-warehouse-env: &airflow-warehouse-env
    POSTGRES_USER: "${POSTGRES_ADMIN}"
    POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    POSTGRES_DB: "${POSTGRES_DB}"
    POSTGRES_ADDRESS_DOCKER: "${POSTGRES_ADDRESS_DOCKER}"
    POSTGRES_PORT_DOCKER: "${POSTGRES_PORT_DOCKER}"
    OPENSEARCH_ADDRESS_DOCKER: "${OPENSEARCH_ADDRESS_DOCKER}"
    OPENSEARCH_PORT_DOCKER: "${OPENSEARCH_PORT_DOCKER}"

services:
    broker:
        image: rabbitmq:3-management-alpine
        restart: unless-stopped
        volumes:
            - broker-data:/var/lib/rabbitmq
        networks:
            - warehouse-backend
        environment:
            RABBITMQ_DEFAULT_USER: "${RABBITMQ_ADMIN}"
            RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PW}"
        healthcheck:
            test: [ "CMD", "rabbitmq-diagnostics", "ping" ]
            interval: 10s
            timeout: 5s
            retries: 3

    flower:
        image: mher/flower
        #build:
        #dockerfile: ./docker/transform/Dockerfile
        #context: .
        networks:
            - warehouse-backend
        depends_on:
            broker:
                condition: service_healthy
            celery:
                condition: service_healthy
        volumes:
            #- ./data/results:/var/celery/results
            - flower-data:/data # persist flower db
        environment:
            CELERY_BROKER_URL: amqp://${RABBITMQ_ADMIN}:${RABBITMQ_PW}@broker:5672//
        command:
          [
              "celery",
              "flower",
              "--address=0.0.0.0",
              "--loglevel=info",
              "--persistent=True",
              "--db=flower_db"
#              "--port=5555"
            #"--without-heartbeat"
          ]

    celery:
        build:
            dockerfile: ./docker/transform/Dockerfile
            context: .
        volumes:
            - ./src:/code/src
            - ./config:/code/config
            - ./cache/fastembed:/root/.cache/fastembed
        networks:
            - warehouse-backend
        depends_on:
            broker:
                condition: service_healthy
        command:
          [
              "celery",
              "-A",
              "transform.tasks",
              "worker",
            #"-Q",
            #"batches",
              "-E",
              "--concurrency=1",
              "--pool=prefork",
              "--loglevel=INFO"
          ]
        #volumes:
        #- ./data/results:/var/celery/results
        env_file: [ keys.env ]
        environment:
            PYTHONPATH: /code/src:/code  # src for tasks.py, root for config/
            CELERY_BROKER_URL: amqp://${RABBITMQ_ADMIN}:${RABBITMQ_PW}@broker:5672//
            EMBEDDING_MODEL: "${EMBEDDING_MODEL}"
            POSTGRES_USER: "${POSTGRES_ADMIN}"
            POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
            POSTGRES_DB: "${POSTGRES_DB}"
            FILE_DB: "${FILE_DB}"
            POSTGRES_ADDRESS_DOCKER: "${POSTGRES_ADDRESS_DOCKER}"
            POSTGRES_PORT_DOCKER: "${POSTGRES_PORT_DOCKER}"
            OPENSEARCH_ADDRESS_DOCKER: "${OPENSEARCH_ADDRESS_DOCKER}"
            OPENSEARCH_PORT_DOCKER: "${OPENSEARCH_PORT_DOCKER}"
            EMBED_API_URL: "${EMBED_API_URL}"
        healthcheck:
            test: celery -A transform.tasks status
            interval: 10s
            timeout: 5s
            retries: 3

    transform:
        build:
            dockerfile: ./docker/transform/Dockerfile
            context: .
        volumes:
            - ./src:/code/src
            - ./config:/code/config
            - ./cache/fastembed:/root/.cache/fastembed
        command: [ "fastapi", "run", "--host", "0.0.0.0", "app/routes.py", "--port", "80" ]
        networks:
            - warehouse-backend
        env_file: [ keys.env ]
        environment:
            PYTHONPATH: /code/src:/code
            CELERY_BROKER_URL: amqp://${RABBITMQ_ADMIN}:${RABBITMQ_PW}@broker:5672//
            POSTGRES_USER: "${POSTGRES_ADMIN}"
            POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
            POSTGRES_DB: "${POSTGRES_DB}"
            POSTGRES_ADDRESS_DOCKER: "${POSTGRES_ADDRESS_DOCKER}"
            POSTGRES_PORT_DOCKER: "${POSTGRES_PORT_DOCKER}"
            OPENSEARCH_ADDRESS_DOCKER: "${OPENSEARCH_ADDRESS_DOCKER}"
            OPENSEARCH_PORT_DOCKER: "${OPENSEARCH_PORT_DOCKER}"
            EMBEDDING_MODEL: "${EMBEDDING_MODEL}"
            CELERY_BATCH_SIZE: "${CELERY_BATCH_SIZE}"
            EMBED_API_URL: "${EMBED_API_URL}"
        depends_on:
            postgres:
                condition: service_healthy
            opensearch:
                condition: service_healthy
            broker:
                condition: service_healthy

    postgres:
        build:
            dockerfile: ./docker/postgres/Dockerfile
            context: .
        # pg_textsearch (BM25) only works preloaded
        command: [ "postgres", "-c", "shared_preload_libraries=pg_textsearch" ]
        environment:
            POSTGRES_USER: "${POSTGRES_ADMIN}"
            POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
            POSTGRES_DB: "${POSTGRES_DB}"
        restart: unless-stopped
        volumes:
            - postgres-data:/var/lib/postgresql/data
        networks:
            - warehouse-backend
        healthcheck:
            test: [ "CMD-SHELL", "pg_isready" ]
            interval: 10s
            timeout: 5s
            retries: 3


    pgadmin:
        image: dpage/pgadmin4:9.8
        container_name: pgadmin4_container
        restart: unless-stopped
        depends_on:
            postgres:
                condition: service_healthy
        environment:
            PGADMIN_DEFAULT_EMAIL: "${PGADMIN_ADMIN}"
            PGADMIN_DEFAULT_PASSWORD: "${PGADMIN_DEFAULT_PASSWORD}"
        volumes:
            - pgadmin-data:/var/lib/pgadmin
        networks:
            - warehouse-backend

    tool-registry:
        image: ghcr.io/eosc-data-commons/tool-registry:latest
        container_name: tool-registry
        restart: unless-stopped
        depends_on:
            postgres:
                condition: service_healthy
        environment:
            TOOL_REGISTRY_DATABASE__HOST: ${POSTGRES_ADDRESS_DOCKER}
            TOOL_REGISTRY_DATABASE__PORT: ${POSTGRES_PORT_DOCKER}
            TOOL_REGISTRY_DATABASE__NAME: ${TOOL_DB}
            TOOL_REGISTRY_DATABASE__USER: ${TOOL_DB_USER}
            TOOL_REGISTRY_DATABASE__PASSWORD: ${TOOL_DB_PASSWORD}
            TOOL_REGISTRY_SERVICE__EGI_ENV: ${EGI_CHECKIN_ENV}
        networks:
            - warehouse-backend

    opensearch:
        restart: unless-stopped
        image: opensearchproject/opensearch:3.2.0
        networks:
            - warehouse-backend
        environment:
            discovery.type: single-node
            bootstrap.memory_lock: "true"
            OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
            cluster.name: opensearch-cluster
            plugins.security.disabled: "true"
            OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_INITIAL_ADMIN_PASSWORD}
        ulimits:
            memlock:
                soft: -1
                hard: -1
            nofile:
                soft: 65536
                hard: 65536
        volumes:
            - opensearch-data:/usr/share/opensearch/data
        healthcheck:
            test: [ "CMD-SHELL", "curl --silent --fail http://localhost:9200/_cluster/health || exit 1" ]

    opensearch-dashboards:
        restart: unless-stopped
        image: opensearchproject/opensearch-dashboards:3.2.0
        environment:
            - OPENSEARCH_HOSTS=["http://opensearch:9200"]
            - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
        volumes:
            - opensearch-dashboards-data:/usr/share/opensearch-dashboards/data
        depends_on:
            opensearch:
                condition: service_healthy
        networks:
            - warehouse-backend

    #https://github.com/EOSC-Data-Commons/matchmaker/pkgs/container/matchmaker-frontend
    frontend:
        image: ghcr.io/eosc-data-commons/matchmaker-frontend:latest
        restart: unless-stopped
        depends_on:
            opensearch:
                condition: service_healthy
        command: npm run prod
        environment:
            - NODE_ENV=production
            - SEARCH_API_URL=http://search-api:8000
            - GRPC_TARGET=coordinator:50051
        networks:
            - warehouse-backend

    #https://github.com/EOSC-Data-Commons/req-packager/pkgs/container/coordinator
    coordinator:
        image: ghcr.io/eosc-data-commons/coordinator:latest
        restart: unless-stopped
        depends_on:
            postgres:
                condition: service_healthy
        command:
            ["rp"]
        environment:
            POSTGRES_USER: "${POSTGRES_ADMIN}"
            POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
            POSTGRES_DB: "${POSTGRES_DB}"
            POSTGRES_ADDRESS_DOCKER: "${POSTGRES_ADDRESS_DOCKER}"
            POSTGRES_PORT_DOCKER: "${POSTGRES_PORT_DOCKER}"
            FILE_DB: "${FILE_DB}"
            TOOL_REGISTRY_API: "https://dev.tools-registry.eosc-data-commons.eu/api/v1"
        networks:
            - warehouse-backend
        ports:
          - "50051:50051"

    # https://github.com/EOSC-Data-Commons/data-commons-search/pkgs/container/data-commons-search
    search-api:
        restart: unless-stopped
        image: ghcr.io/eosc-data-commons/data-commons-search:latest
        depends_on:
            opensearch:
                condition: service_healthy
        volumes:
            - search-api-data:/app/data
        env_file: [ keys.env ]
        environment:
            - OPENSEARCH_URL=http://opensearch:9200
        networks:
            - warehouse-backend

    # https://github.com/EOSC-Data-Commons/metadata-crawlers/pkgs/container/metadata-crawlers
    harvester:
        image: ghcr.io/eosc-data-commons/metadata-crawlers:latest
        profiles: ["manual"]
        env_file:
            - .env
        volumes:
            - harvester-logs:/app/logs
        entrypoint: ["python", "-m", "harvester"]
        networks:
            - warehouse-backend

    scheduler:
      build:
        dockerfile: ./docker/scheduler/Dockerfile
        context: .
      profiles: ["manual"]
      command: ["python", "-m", "scheduler.run"]
      env_file:
        - .env
      depends_on:
        postgres:
          condition: service_healthy
        opensearch:
          condition: service_healthy
        transform:
          condition: service_started
      networks:
        - warehouse-backend
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock
        - ./docker-compose.yml:/app/compose.yml
        - ./.env:/app/.env

    # ---------------------------------------------------------------- Airflow
    airflow-postgres:
        image: postgres:16
        restart: unless-stopped
        environment:
            POSTGRES_USER: airflow
            POSTGRES_PASSWORD: "${AIRFLOW_DB_PASSWORD}"
            POSTGRES_DB: airflow
        volumes:
            - airflow-postgres-data:/var/lib/postgresql/data
        networks:
            - warehouse-backend
        healthcheck:
            test: [ "CMD", "pg_isready", "-U", "airflow", "-d", "airflow" ]
            interval: 10s
            timeout: 5s
            retries: 5

    # one-shot: migrates the airflow DB and creates the admin user, then exits
    airflow-init:
        <<: *airflow-common
        user: "0:0"
        entrypoint: /bin/bash
        command:
            - -c
            - |
                mkdir -p /opt/airflow/logs
                chown -R "${AIRFLOW_UID:-50000}:0" /opt/airflow/logs
                exec /entrypoint airflow version
        environment:
            <<: *airflow-common-env
            _AIRFLOW_DB_MIGRATE: "true"
            _AIRFLOW_WWW_USER_CREATE: "true"
            _AIRFLOW_WWW_USER_USERNAME: "${AIRFLOW_ADMIN_USER:-airflow}"
            _AIRFLOW_WWW_USER_PASSWORD: "${AIRFLOW_ADMIN_PASSWORD}"
        depends_on: *airflow-common-depends-on

    airflow-api-server:
        <<: *airflow-common
        restart: unless-stopped
        command: api-server
        healthcheck:
            test: [ "CMD", "curl", "--fail", "http://localhost:8080/api/v2/version" ]
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 30s
        depends_on:
            <<: *airflow-common-depends-on
            airflow-init:
                condition: service_completed_successfully

    airflow-scheduler:
        <<: *airflow-common
        restart: unless-stopped
        command: scheduler
        healthcheck:
            test: [ "CMD", "curl", "--fail", "http://localhost:8974/health" ]
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 30s
        depends_on:
            <<: *airflow-common-depends-on
            airflow-init:
                condition: service_completed_successfully

    airflow-dag-processor:
        <<: *airflow-common
        restart: unless-stopped
        command: dag-processor
        healthcheck:
            test: [ "CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"' ]
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 30s
        depends_on:
            <<: *airflow-common-depends-on
            airflow-init:
                condition: service_completed_successfully

    # Celery worker consuming the default queue (planning, sending batches to the transform Celery worker).
    airflow-worker:
        <<: *airflow-common
        restart: unless-stopped
        command: celery worker --queues default
        environment:
            <<: [ *airflow-common-env, *airflow-warehouse-env ]
            # graceful shutdown: let running tasks finish
            DUMB_INIT_SETSID: "0"
        healthcheck:
            test:
                - "CMD-SHELL"
                - 'celery --app airflow.providers.celery.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}" || celery --app airflow.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}"'
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 30s
        depends_on:
            <<: *airflow-common-depends-on
            airflow-api-server:
                condition: service_healthy
            airflow-init:
                condition: service_completed_successfully

volumes:
    postgres-data:
    pgadmin-data:
    opensearch-data:
    opensearch-dashboards-data:
    broker-data:
    flower-data:
    search-api-data:
    frontend-data:
    harvester-logs:
    airflow-postgres-data:
    airflow-logs:

networks:
    warehouse-backend:
