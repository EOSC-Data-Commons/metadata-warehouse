[project]
name = "metadata-warehouse-transformer"
version = "0.0.1"
description = "Prepare and import DataCite OAI-PMH XML metadata into PostgreSQL and OpenSearch"
requires-python = ">=3.12"
dependencies = [
    "opensearch-py>=3.1.0",
    "celery[redis]>=5.6.2",
    "xmltodict>=1.0.4",
    "jsonschema>=4.26.0",
    "fastembed>=0.7.4",
    "watchdog>=6.0.0",
    "fastapi[standard]>=0.135.1",
    "psycopg[binary]>=3.3.3",
    # "flower", # only needed when not using mher/flower
    "datahugger-ng>=0.5.3",
]


[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "types-xmltodict>=1.0.1.20260113",
    "celery-stubs>=0.1.3",
    "mypy>=1.19.1",
    "types-jsonschema>=4.26.0.20260202",
    "types-requests>=2.32.4.20260107",
    "lxml-stubs>=0.5.1",
    "python-dotenv>=1.2.2",
    "celery-types>=0.24.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
